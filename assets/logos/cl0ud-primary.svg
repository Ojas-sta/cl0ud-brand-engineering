<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="280" height="70" rx="12" fill="#0B0F19"/>
  <rect width="278" height="68" x="1" y="1" rx="11" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Geometric Cloud Icon -->
  <g transform="translate(18, 14)">
    <!-- Outer Cloud Shell -->
    <path d="M 28 8 A 9 9 0 0 1 36 17 A 7 7 0 0 1 41 24 A 6 6 0 0 1 37 34 L 10 34 A 8 8 0 0 1 7 19 A 9 9 0 0 1 17 11 A 10 10 0 0 1 28 8 Z" 
          fill="none" stroke="url(#cloudGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Central Geometric Node / Zero 0 Core -->
    <ellipse cx="23" cy="22" rx="4.5" ry="6" fill="none" stroke="#00E5FF" stroke-width="1.8"/>
    <line x1="20" y1="26" x2="26" y2="18" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hardware Node Points -->
    <circle cx="10" cy="34" r="1.5" fill="#00E5FF"/>
    <circle cx="37" cy="34" r="1.5" fill="#00E5FF"/>
    <circle cx="28" cy="8" r="1.5" fill="#00E5FF"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(75, 43)">
    <!-- cl -->
    <text font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC" letter-spacing="-0.03em">cl</text>
    <!-- 0 with distinct identity -->
    <text x="25" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="28" fill="#00E5FF" letter-spacing="-0.02em">0</text>
    <!-- ud -->
    <text x="44" font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC" letter-spacing="-0.03em">ud</text>
    <!-- Engineering Subtitle -->
    <text x="84" y="-3" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="10" fill="#94A3B8" letter-spacing="0.18em">.ENGINEERING</text>
  </g>
</svg>
