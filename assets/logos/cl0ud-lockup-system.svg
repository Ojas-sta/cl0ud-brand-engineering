<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960" fill="none">
  <!-- cl0ud Apple-Style Subsystem Lockup System Specification (Expanded for Hierarchical & Embedded IAC) -->
  <defs>
    <!-- Prismatic Titanium Gradient (Apple Card Style Reference) -->
    <linearGradient id="appleCardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="25%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="75%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Master Infinity-Cloud Symbol Definition (Normalized 608x408) -->
    <g id="cloud-symbol">
      <path fill="currentColor" fill-rule="evenodd" d="M 309.8 1.5 c -23.8 3.0 -45.7 11.0 -65.4 23.8 -16.7 10.8 -31.5 24.8 -42.8 40.3 l -5.5 7.6 -5.1 -1.4 c -7.4 -2.1 -26.8 -2.8 -36.7 -1.3 -39.4 5.7 -70.9 32.3 -83.0 70.0 l -2.7 8.5 -8.8 6.2 c -38.8 27.0 -59.7 66.9 -59.7 113.8 -0.1 22.0 4.3 40.6 14.2 61.0 6.8 14.0 15.6 25.8 28.0 37.8 19.9 19.2 41.2 30.5 68.4 36.4 6.9 1.5 13.4 1.8 40.7 1.8 35.1 -0.0 39.2 -0.4 55.4 -5.7 34.2 -11.0 63.0 -34.9 96.1 -79.7 37.2 -50.3 44.9 -60.4 55.3 -72.2 22.3 -25.5 45.9 -42.4 72.3 -51.7 11.5 -4.1 22.8 -5.6 35.3 -4.9 11.9 0.7 19.5 2.6 29.1 7.2 19.6 9.5 33.7 26.4 40.7 48.5 2.0 6.4 2.3 9.5 2.3 21.5 -0.1 13.2 -0.3 14.5 -3.5 23.9 -7.1 20.9 -21.6 37.0 -41.5 46.2 -14.9 6.9 -13.3 6.7 -83.5 7.2 l -63.5 0.4 -13.5 18.0 c -7.4 9.9 -18.2 23.4 -23.8 30.0 l -10.4 11.9 90.9 -0.4 c 89.0 -0.3 91.0 -0.4 99.3 -2.5 19.3 -4.8 31.9 -10.5 49.1 -22.0 47.4 -31.7 69.8 -91.1 55.6 -147.2 -12.3 -48.2 -49.8 -85.9 -98.0 -98.4 l -9.0 -2.4 -2.3 -9.8 c -2.9 -12.7 -7.1 -24.0 -13.9 -37.3 -22.0 -42.6 -62.3 -73.3 -109.0 -83.1 -11.5 -2.4 -39.4 -3.5 -51.1 -2.0 z m 39.2 60.4 c 29.0 6.2 55.4 26.2 68.1 51.9 4.8 9.7 9.7 23.8 8.6 24.7 -0.5 0.3 -3.3 1.4 -6.3 2.5 -28.5 9.6 -52.0 25.4 -80.5 53.9 -19.7 19.8 -28.6 30.4 -57.0 68.1 -22.1 29.4 -29.2 38.0 -41.2 49.6 -20.2 19.6 -39.7 29.9 -62.9 33.0 -5.7 0.7 -16.9 1.0 -31.9 0.6 -19.6 -0.4 -24.1 -0.8 -30.5 -2.6 -45.2 -13.1 -68.8 -61.6 -51.0 -104.5 9.5 -22.8 26.7 -37.9 51.2 -45.0 l 8.3 -2.4 0.6 -12.8 c 0.6 -15.4 2.9 -23.2 9.1 -31.5 7.6 -10.2 19.2 -16.8 32.3 -18.4 7.2 -0.8 7.8 -0.1 6.4 7.1 -0.8 4.1 -1.3 29.3 -1.6 82.2 l -0.4 76.4 3.3 -0.7 c 16.0 -3.5 33.6 -17.1 49.7 -38.7 l 7.2 -9.8 -0.7 -42.2 c -0.4 -28.7 -0.3 -45.4 0.5 -51.9 3.2 -28.0 16.3 -52.6 37.0 -69.1 13.7 -11.0 32.0 -19.2 48.6 -21.8 7.8 -1.2 24.2 -0.5 33.1 1.4 z"/>
    </g>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="960" fill="#0B0F19"/>
  <rect x="20" y="20" width="960" height="920" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="60" y="65" font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#00E5FF" letter-spacing="0.05em">CL0UD SUBSYSTEM BRAND LOCKUP SPECIFICATION</text>
  <text x="60" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">Single Subsystems &amp; Hierarchical Nested Subsystems (Subsystems inside Subsystems)</text>
  <text x="60" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">Metrics: Height = 1.05 × Cap-Height | Optical Gap = 0.40 × Cap-Height | Delimiter = • (U+2022)</text>

  <!-- Line Divider -->
  <line x1="60" y1="125" x2="940" y2="125" stroke="#1E293B" stroke-width="1"/>

  <!-- ==================== EXAMPLE 1: PRISMATIC TITANIUM (Apple Card Style) ==================== -->
  <g transform="translate(60, 150)">
    <rect width="880" height="150" rx="12" fill="#030712" stroke="#1F2937" stroke-width="1"/>
    <text x="30" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">01. PRISMATIC TITANIUM STYLE (Reference: Apple Card Hero Architecture)</text>
    
    <!-- Lockup: [☁] Bedrock -->
    <g transform="translate(40, 52)" fill="url(#appleCardGrad)">
      <use href="#cloud-symbol" transform="scale(0.137)"/>
      <text x="105" y="47" font-family="'Outfit', 'SF Pro Display', -apple-system, sans-serif" font-size="64" font-weight="600" letter-spacing="-0.025em">Bedrock</text>
    </g>

    <text x="460" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">Platform: Isolated Multi-Rail Power &amp; Buck Topology</text>
    <text x="460" y="93" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00E5FF">Designation: ☁ Bedrock</text>
    <text x="460" y="111" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">Scope: Quadruped 28.8V -> 12V / 5V / 3.3V Step-Down Architecture</text>
  </g>

  <!-- ==================== EXAMPLE 2: INFRASTRUCTURE AS CIRCUIT (IAC & Wiring) ==================== -->
  <g transform="translate(60, 325)">
    <rect width="880" height="150" rx="12" fill="#030712" stroke="#1F2937" stroke-width="1"/>
    <text x="30" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">02. INFRASTRUCTURE-AS-CIRCUIT &amp; WIRING AUTOMATION (Hardware-as-Code)</text>
    
    <!-- Lockup: [☁ in Cyan] Wireframe -->
    <g transform="translate(40, 52)">
      <use href="#cloud-symbol" transform="scale(0.137)" fill="url(#cyanGrad)"/>
      <text x="105" y="47" font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="700" fill="#F8FAFC" letter-spacing="-0.02em">Wireframe</text>
    </g>

    <text x="500" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">Platform: Declarative Pinout Compiler &amp; Netlist Assertions</text>
    <text x="500" y="93" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00E5FF">Designation: ☁ Wireframe</text>
    <text x="500" y="111" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">Scope: YAML/JSON -> pins.h, strapping pin conflict checks, level shifting</text>
  </g>

  <!-- ==================== EXAMPLE 3: HIERARCHICAL LOCKUP — SMARTLOCK LATCH ==================== -->
  <g transform="translate(60, 500)">
    <rect width="880" height="175" rx="12" fill="#030712" stroke="#1F2937" stroke-width="1"/>
    <text x="30" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">03. HIERARCHICAL LOCKUP: ESP32 SMARTLOCK ACCESS SYSTEM (Nested Subsystem)</text>
    
    <!-- Lockup: [☁] Access • Latch -->
    <g transform="translate(40, 52)">
      <use href="#cloud-symbol" transform="scale(0.137)" fill="url(#cyanGrad)"/>
      <text x="105" y="47" font-family="'Outfit', system-ui, sans-serif" font-size="60" font-weight="600" fill="#F8FAFC" letter-spacing="-0.02em">Access</text>
      <!-- Delimiter • -->
      <text x="330" y="47" font-family="'Outfit', system-ui, sans-serif" font-size="60" font-weight="700" fill="#00E5FF"> • </text>
      <!-- Child Subsystem -->
      <text x="385" y="47" font-family="'Outfit', system-ui, sans-serif" font-size="52" font-weight="500" fill="#94A3B8" letter-spacing="-0.01em">Latch</text>
    </g>

    <!-- Technical Specs Box -->
    <path d="M 40 120 L 840 120" stroke="#1E293B" stroke-width="1"/>
    <text x="40" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">Parent Domain: ☁ Access (Physical Control)</text>
    <text x="340" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">Child: ☁ Access.Latch (GPIO 18 | 50Hz LEDC PWM | 0° ⇄ 90°)</text>
    <text x="40" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">Peers: ☁ Access.Portal (SoftAP 192.168.4.1) | ☁ Access.OTP (1000-9999) | ☁ Access.Keypad (4x4 Matrix)</text>
  </g>

  <!-- ==================== EXAMPLE 4: HIERARCHICAL LOCKUP — BINZO MECANUM ==================== -->
  <g transform="translate(60, 700)">
    <rect width="880" height="175" rx="12" fill="#030712" stroke="#1F2937" stroke-width="1"/>
    <text x="30" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">04. HIERARCHICAL LOCKUP: BINZO AUTONOMOUS ROBOT (Mecanum Kinematics)</text>
    
    <!-- Lockup: [☁] Binzo • Holonomic -->
    <g transform="translate(40, 52)">
      <use href="#cloud-symbol" transform="scale(0.137)" fill="url(#cyanGrad)"/>
      <text x="105" y="47" font-family="'Outfit', system-ui, sans-serif" font-size="60" font-weight="600" fill="#F8FAFC" letter-spacing="-0.02em">Binzo</text>
      <!-- Delimiter • -->
      <text x="275" y="47" font-family="'Outfit', system-ui, sans-serif" font-size="60" font-weight="700" fill="#00E5FF"> • </text>
      <!-- Child Subsystem -->
      <text x="330" y="47" font-family="'Outfit', system-ui, sans-serif" font-size="52" font-weight="500" fill="#94A3B8" letter-spacing="-0.01em">Holonomic</text>
    </g>

    <!-- Technical Specs Box -->
    <path d="M 40 120 L 840 120" stroke="#1E293B" stroke-width="1"/>
    <text x="40" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">Parent Domain: ☁ Binzo (Autonomous Service Robot)</text>
    <text x="380" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">Child: ☁ Binzo.Holonomic (4WD Mecanum Vector Kinematics)</text>
    <text x="40" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">Peers: ☁ Binzo.MotorDriver (I2C 0x24) | ☁ Binzo.Patrol (IR Port B) | ☁ Binzo.Sight (K210 UART2 Port C)</text>
  </g>

  <!-- Footer Blueprint Grid Guides Note -->
  <text x="60" y="910" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">cl0ud Subsystem Architecture Standard: All lockups preserve 1.05x cap-height symbol scaling and 0.40x cap-height optical kerning.</text>
</svg>
