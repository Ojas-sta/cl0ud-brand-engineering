<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" fill="none">
  <!-- Exhibition Plinth Credit Plate -->
  <defs>
    <linearGradient id="plinthMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Brushed Metal Plinth Base -->
  <rect width="400" height="120" rx="14" fill="url(#plinthMetal)"/>
  <rect width="396" height="116" x="2" y="2" rx="12" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Chamfered Screw Anchors -->
  <circle cx="16" cy="16" r="3" fill="#64748B"/>
  <circle cx="384" cy="16" r="3" fill="#64748B"/>
  <circle cx="16" cy="104" r="3" fill="#64748B"/>
  <circle cx="384" cy="104" r="3" fill="#64748B"/>

  <!-- Left Icon -->
  <g transform="translate(30, 30)">
    <path d="M 28 8 A 9 9 0 0 1 36 17 A 7 7 0 0 1 41 24 A 6 6 0 0 1 37 34 L 10 34 A 8 8 0 0 1 7 19 A 9 9 0 0 1 17 11 A 10 10 0 0 1 28 8 Z" 
          fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="23" cy="22" rx="4.5" ry="6" fill="none" stroke="#00E5FF" stroke-width="1.8"/>
    <line x1="20" y1="26" x2="26" y2="18" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Plaque -->
  <g transform="translate(95, 45)">
    <text font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC" letter-spacing="-0.02em">
      SYSTEMS ARCHITECTURE POWERED BY <tspan fill="#00E5FF">cl0ud</tspan>
    </text>
    <text y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="0.04em">
      CO-ENGINEERED BY OJAS SINGH
    </text>
    <text y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0.08em">
      DPSI STUDENT ROBOTICS &amp; AUTONOMOUS SYSTEMS LAB
    </text>
  </g>
</svg>
